<!DOCTYPE html>
<html>

<head>
    <title>Student Registration Form</title>
</head>

<body style="background-color: rgb(139, 130, 255);">

    <h1 style="color: darkblue; text-align: center;">
        Student Registration Form
    </h1>

    <form style="
        background-color: white;
        width: 500px;
        margin: 20px auto;
        padding: 25px;
    ">

        <label>Full Name:</label>
        <br>

        <input type="text" placeholder="Enter your full name" required style="
                width: 95%;
                height: 30px;
                margin: 10px 0;
                padding: 5px;
            ">

        <br><br>


        <label>Password:</label>
        <br>

        <input type="password" placeholder="Enter your password" minlength="8" maxlength="20" required style="
                width: 95%;
                height: 30px;
                margin: 10px 0;
                padding: 5px;
            ">

        <br><br>


        <label>Contact Number:</label>
        <br>

        <input type="tel" placeholder="Enter your contact number" required style="
                width: 95%;
                height: 30px;
                margin: 10px 0;
                padding: 5px;
            ">

        <br><br>


        <label>Gender:</label>
        <br><br>

        <input type="radio" name="gender" required>
        <label>Male</label>

        <input type="radio" name="gender">
        <label>Female</label>

        <input type="radio" name="gender">
        <label>Other</label>

        <br><br>


        <label>Select Courses:</label>
        <br><br>

        <input type="checkbox">
        <label>HTML</label>

        <input type="checkbox">
        <label>CSS</label>

        <input type="checkbox">
        <label>JavaScript</label>

        <input type="checkbox">
        <label>React</label>

        <br><br>


        <label>Email:</label>
        <br>

        <input type="email" placeholder="Enter your email" style="
                width: 95%;
                height: 30px;
                margin: 10px 0;
                padding: 5px;
            ">

        <br><br>


        <label>Address:</label>
        <br>

        <textarea placeholder="Enter your address" style="
                width: 95%;
                height: 70px;
                margin: 10px 0;
                padding: 5px;
            "></textarea>

        <br><br>


        <button type="submit" style="
                background-color: green;
                color: white;
                width: 100%;
                height: 40px;
                font-size: 18px;
            ">
            Submit
        </button>

    </form>

</body>

</html>
